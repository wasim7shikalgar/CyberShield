services:
  - type: web
    name: cybershield
    runtime: python
    buildCommand: apt-get update && apt-get install -y ffmpeg libportaudio2 portaudio19-dev && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9